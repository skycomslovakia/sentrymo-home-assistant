refresh:
  name: Refresh Sentrymo data
  description: Force an immediate Sentrymo data refresh.
  fields:
    entry_id:
      name: Entry ID
      description: Optional Home Assistant config entry ID. When omitted, all Sentrymo entries are refreshed.
      required: false
      selector:
        text:

set_protection_mode:
  name: Set protection mode
  description: Change Sentrymo vehicle protection mode. This uses the CPIN stored during pairing.
  fields:
    vehicle_id:
      name: Vehicle ID
      description: Sentrymo vehicle ID.
      required: true
      selector:
        text:
    mode:
      name: Mode
      description: Protection mode.
      required: true
      selector:
        select:
          options:
            - disabled
            - manual
            - automatic
    entry_id:
      name: Entry ID
      description: Optional Home Assistant config entry ID.
      required: false
      selector:
        text:

set_immobilizer:
  name: Set immobilizer
  description: Activate or deactivate the Sentrymo immobilizer output. This uses the CPIN stored during pairing.
  fields:
    vehicle_id:
      name: Vehicle ID
      description: Sentrymo vehicle ID.
      required: true
      selector:
        text:
    enabled:
      name: Enabled
      description: Turn the immobilizer output on or off.
      required: true
      selector:
        boolean:
    entry_id:
      name: Entry ID
      description: Optional Home Assistant config entry ID.
      required: false
      selector:
        text:

set_accessory:
  name: Set accessory
  description: Activate or deactivate the Sentrymo accessory output. This uses the CPIN stored during pairing.
  fields:
    vehicle_id:
      name: Vehicle ID
      description: Sentrymo vehicle ID.
      required: true
      selector:
        text:
    enabled:
      name: Enabled
      description: Turn the accessory output on or off.
      required: true
      selector:
        boolean:
    entry_id:
      name: Entry ID
      description: Optional Home Assistant config entry ID.
      required: false
      selector:
        text:
